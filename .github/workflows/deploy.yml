name: Build & Deploy

on:
  push:
    branches: ['**']

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to nginx
        run: |
          rsync -a --delete dist/ /home/vincent/stragame/dist/
