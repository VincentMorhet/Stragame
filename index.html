<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Stragame — Tower Defense</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0d12;
        color: #eee;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <pre id="err" style="position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px;background:#7f1d1d;color:#fee;font:12px/1.4 monospace;white-space:pre-wrap;display:none;z-index:9999;max-height:40vh;overflow:auto;"></pre>
    <script>
      (function () {
        var box = document.getElementById("err");
        function show(msg) {
          box.style.display = "block";
          box.textContent += msg + "\n";
        }
        window.addEventListener("error", function (e) {
          show("ERR: " + (e.message || e.error) + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("REJ: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
